name: ForkSession repair gates

on:
  push:
    branches: [ci/agentscope-go-fork-baseline-20261127]
    paths: [.github/workflows/forksession-baseline-once.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.repository == 'GoldArowana/agentscope-go'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Materialize and verify the two-file production and test tree
        run: |
          test "$(git rev-parse HEAD^^)" = 12f8eebddf9aa370f2904cc1b8835aeae968df67
          test "$(git rev-parse HEAD^)" = f8934e6a985ecdb885214db8617dc4ef206ffa2b
          git rm -- .github/workflows/forksession-baseline-once.yml
          test "$(git write-tree)" = 751fe148cdce80c1c1168865c05572a12069f9e0
          git diff --exit-code
          echo "VERIFIED_REPAIR_TREE 751fe148cdce80c1c1168865c05572a12069f9e0"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.25'
          cache: false
      - name: ForkSession behavior and unchanged controls
        run: go test -mod=readonly -count=1 -v ./pkg/agentscope/agent -run '^TestForkSession_'
      - name: Build
        run: |
          go build ./...
          go build ./examples/...
      - name: Module tidiness
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Full race suite
        run: go test -race -count=1 ./...
      - name: Coverage floor
        if: matrix.os == 'ubuntu-latest'
        run: make cover-check
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          skip-cache: true
